<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
    <script>
      // Login popup must answer from this exact origin (see admin/callback.html).
      CMS.init({ config: { backend: { base_url: window.location.origin } } });

      // ───────────────────────────────────────────────────────────────────
      // CSS: reuse the real built site, don't recreate it.
      //
      // The build inlines each page's CSS into its own <style> tag (see
      // astro.config.mjs: inlineStylesheets: 'always'), so there is no single
      // standalone stylesheet to link — the only way to get real site styles
      // into the preview pane is to fetch a built page and lift its <style>
      // tag out. Tailwind's utility classes are identical everywhere (the
      // JIT scan is project-wide, not per page), but each page also carries
      // its own hashed component-scoped styles (Astro's `data-astro-cid-*`
      // rules) for whatever components that page actually uses. So one route
      // is not enough for every preview below:
      //   - "/blogs/" carries .prose-content (blog + legal bodies).
      //   - "/" (the homepage) additionally carries the scoped styles for
      //     Hero/FaqSection/HowItWorks/FeaturesSection and friends.
      //   - "/pricing" additionally carries pricing.astro's own scoped
      //     <style> block (.billing-btn, .billing-note), which exists
      //     nowhere else in the built output.
      // A failed fetch is logged rather than swallowed, since a silent
      // failure would just look like "the preview has no styling" with no
      // clue why.
      function loadPreviewStyles(path) {
        fetch(path)
          .then((r) => {
            if (!r.ok) throw new Error(`${path} responded with ${r.status}`);
            return r.text();
          })
          .then((html) => {
            const doc = new DOMParser().parseFromString(html, "text/html");
            const css = [...doc.querySelectorAll("style")].map((s) => s.textContent).join("\n");
            if (!css) throw new Error(`${path} had no inlined <style> tag to copy`);
            CMS.registerPreviewStyle(css, { raw: true });
          })
          .catch((error) => {
            console.error(`[admin preview] could not load styles from ${path}:`, error);
          });
      }

      loadPreviewStyles("/blogs/");
      loadPreviewStyles("/");
      loadPreviewStyles("/pricing");

      // ───────────────────────────────────────────────────────────────────
      // Shared helpers. Every template below reads fields the same safe way
      // and renders the same handful of repeated pieces (a section header,
      // a CTA button, a row of trust-point bullets) through these, rather
      // than re-implementing them per collection.

      // Reads one frontmatter field without throwing on a missing/empty entry.
      function field(entry, path, fallback) {
        return entry.getIn(["data", ...path], fallback);
      }

      // Immutable List -> plain array, treating a missing list as empty.
      function list(entry, path) {
        const value = entry.getIn(["data", ...path]);
        return value && typeof value.toJS === "function" ? value.toJS() : [];
      }

      // A nested list field reached through `list()` (e.g. one item of a list
      // of objects that itself has a list field) should already be a plain
      // array, since Immutable's `toJS()` converts recursively. Normalizing
      // again here costs nothing and avoids depending on that always holding.
      function toPlainArray(value) {
        if (Array.isArray(value)) return value;
        if (value && typeof value.toJS === "function") return value.toJS();
        return [];
      }

      // The label + h2.h-section + optional lede pattern SectionHead.astro
      // renders everywhere (features, pricing, every optional band on a
      // solutions page). `dark` matches its own `dark` prop (ink background).
      function sectionHeader({ label, heading, sub, dark }) {
        return h(
          "div",
          {},
          label && h("p", { className: dark ? "label label-dark" : "label", style: { marginBottom: "1.25rem" } }, label),
          heading && h("h2", { className: "h-section", style: dark ? { color: "#fff" } : undefined }, heading),
          sub &&
            h(
              "p",
              { className: "lede", style: { marginTop: "1rem", color: dark ? "rgba(255,255,255,0.7)" : undefined } },
              sub
            )
        );
      }

      // One CTA, styled like the real `btn btn-primary` / `btn btn-line`
      // pair every cta object renders as (see e.g. [...slug].astro's `ctaClass`).
      function ctaLink(cta, opts, key) {
        if (!cta) return null;
        const primary = (opts && opts.primary) || "btn btn-primary";
        const secondary = (opts && opts.secondary) || "btn btn-line";
        return h("a", { key, href: cta.href, className: cta.style === "primary" ? primary : secondary }, cta.label);
      }

      // The "No credit card required / GDPR ready" style row of bullets
      // (HeroSection.astro, the solutions hero, pricing, try-free).
      function bulletRow(points) {
        if (!points || points.length === 0) return null;
        return h(
          "div",
          { style: { display: "flex", flexWrap: "wrap", gap: "1.25rem", marginTop: "1.25rem" } },
          points.map((point, i) =>
            h(
              "span",
              { key: i, className: "text-sm text-mute", style: { display: "flex", alignItems: "center", gap: "0.5rem" } },
              h("span", { "aria-hidden": "true", className: "size-1.5 bg-brand" }),
              point
            )
          )
        );
      }

      // ───────────────────────────────────────────────────────────────────
      // blog (folder collection). Same wrapper as src/pages/blogs/[slug].astro,
      // so .prose-content styles apply.
      CMS.registerPreviewTemplate("blog", ({ entry, widgetFor }) =>
        h("div", { className: "prose-content", style: { padding: "2rem" } },
          h("h1", {}, entry.getIn(["data", "title"])),
          widgetFor("body")
        )
      );

      // legal (folder collection). Same wrapper as src/pages/legal/[slug].astro:
      // title, "Last updated" line, then the policy body through .prose-content.
      CMS.registerPreviewTemplate("legal", ({ entry, widgetFor }) =>
        h("div", { style: { padding: "2rem" } },
          h("p", { className: "label", style: { marginBottom: "0.75rem" } }, "Legal"),
          h("h1", { style: { marginBottom: "0.5rem" } }, field(entry, ["title"], "")),
          field(entry, ["summary"], "") &&
            h("p", { className: "lede", style: { marginTop: "0.5rem" } }, field(entry, ["summary"], "")),
          field(entry, ["updated"], "") &&
            h(
              "p",
              { className: "text-sm text-mute", style: { marginTop: "0.75rem" } },
              `Last updated ${field(entry, ["updated"], "")}`
            ),
          h("div", { className: "prose-content", style: { marginTop: "2rem" } }, widgetFor("body"))
        )
      );

      // sections/hero.md. The mock product illustration (the statement ->
      // trial balance window in HeroSection.astro) pulls its sample data from
      // the separate `features` collection, which this entry's own fields
      // don't carry — the preview sticks to what hero.md actually controls:
      // badge, headline, trust points and the secondary CTA.
      CMS.registerPreviewTemplate("hero", ({ entry }) => {
        const before = field(entry, ["headline", "before"], "");
        const accent = field(entry, ["headline", "accent"], "");
        const after = field(entry, ["headline", "after"], "");
        const ctas = list(entry, ["ctas"]);
        const secondaryCta = ctas[0];

        return h(
          "section",
          { className: "grid-paper bg-paper", style: { padding: "2.5rem 2rem" } },
          field(entry, ["badge"], "") &&
            h("p", { className: "label", style: { marginBottom: "1.25rem" } }, field(entry, ["badge"], "")),
          h(
            "h1",
            { className: "display", style: { maxWidth: "20ch" } },
            `${before} `,
            h("span", { className: "mark" }, accent),
            ` ${after}`
          ),
          bulletRow(list(entry, ["trustPoints"])),
          secondaryCta &&
            h("a", { className: "link", href: secondaryCta.href, style: { display: "inline-block", marginTop: "1rem" } }, secondaryCta.label)
        );
      });

      // sections/faq.md. FaqSection.astro renders this header plus the
      // accordion itself, whose questions live in the separate `faqs`
      // collection — not fields on this entry — so the preview shows the
      // header only, matching FaqBlock.astro's left column.
      CMS.registerPreviewTemplate("faq", ({ entry }) =>
        h(
          "section",
          { className: "bg-paper grid-paper", style: { padding: "2.5rem 2rem" } },
          sectionHeader({
            label: field(entry, ["eyebrow"], ""),
            heading: field(entry, ["heading"], ""),
            sub: field(entry, ["subheading"], ""),
          }),
          h(
            "p",
            { className: "text-sm text-mute", style: { marginTop: "1.5rem" } },
            "Questions themselves are edited in the FAQs collection."
          )
        )
      );

      // faqs (folder collection): one accordion row, matching the
      // <details>/<summary> markup FaqList.astro renders inside FaqBlock's sheet.
      CMS.registerPreviewTemplate("faqs", ({ entry }) =>
        h(
          "div",
          { className: "sheet", style: { padding: "0 1.25rem" } },
          h(
            "details",
            { open: true, style: { padding: "1.25rem 0" } },
            h(
              "summary",
              { className: "text-[1.0625rem] font-medium text-ink", style: { listStyle: "none", cursor: "default" } },
              field(entry, ["question"], "")
            ),
            h(
              "p",
              { className: "text-mute", style: { marginTop: "0.75rem", lineHeight: 1.6 } },
              field(entry, ["answer"], "")
            )
          )
        )
      );

      // sections/how-it-works.md. HowItWorks.astro renders this header on the
      // ink band, then the numbered steps, which live in the separate
      // `steps` collection — not fields on this entry — so the preview shows
      // the header only, matching Steps.astro's SectionHead usage.
      CMS.registerPreviewTemplate("how-it-works", ({ entry }) =>
        h(
          "section",
          { className: "on-dark bg-ink", style: { padding: "2.5rem 2rem" } },
          sectionHeader({
            label: field(entry, ["eyebrow"], ""),
            heading: field(entry, ["heading"], ""),
            dark: true,
          }),
          h(
            "p",
            { className: "text-sm", style: { marginTop: "1.5rem", color: "rgba(255,255,255,0.65)" } },
            "Steps themselves are edited in the How-it-works steps collection."
          )
        )
      );

      // steps (folder collection): one numbered card, matching the <li> Steps.astro
      // renders on the ink band (big numeral, optional icon, title, description).
      // Icons are skipped — the icon set lives in icons-data.ts and isn't loaded here.
      CMS.registerPreviewTemplate("steps", ({ entry }) =>
        h(
          "div",
          { className: "on-dark bg-ink", style: { padding: "2rem", maxWidth: "24rem" } },
          h(
            "span",
            { className: "font-display font-bold text-6xl text-brand", style: { display: "block", lineHeight: 1 } },
            field(entry, ["number"], "")
          ),
          h("h3", { className: "h-row text-2xl", style: { color: "#fff", marginTop: "1.5rem" } }, field(entry, ["title"], "")),
          h(
            "p",
            { className: "text-white/65", style: { marginTop: "0.75rem", lineHeight: 1.6 } },
            field(entry, ["description"], "")
          )
        )
      );

      // ───────────────────────────────────────────────────────────────────
      // "features" naming collision: config.yml uses the literal name
      // "features" for TWO different things — the top-level `features`
      // folder collection (one full card per product feature) and the file
      // named "features" inside the `sections` files collection (just the
      // header above those cards, rendered by FeaturesSection.astro via
      // SectionHead). Decap's preview-template registry is a flat
      // {name: component} map with no per-collection scoping — confirmed
      // against the decap-cms@3.17.1 bundle itself:
      //   registerPreviewTemplate: function(e,t){dr.templates[e]=t}
      // — so whichever of the two is registered last would silently replace
      // the other under a naive per-collection registration. Rather than
      // assume which one Decap's internal lookup actually passes through
      // (the docs only confirm "file collections use the file's name," not
      // how a clash like this resolves), this single registration inspects
      // the entry's own fields and renders the matching markup either way:
      // a feature card entry always has a required `title`; the sections
      // header file never does.
      function renderFeatureVisual(entry, visual) {
        const row = { borderBottom: "1px solid var(--color-rule)", padding: "0.75rem 1.25rem" };

        if (visual === "email") {
          const emails = list(entry, ["emails"]);
          const emailNote = field(entry, ["emailNote"], "");
          return h(
            "ul",
            {},
            emails.map((email, i) =>
              h(
                "li",
                { key: i, style: { ...row, display: "flex", gap: "1rem" } },
                h("span", { className: "fig text-xs text-mute" }, email.time),
                h(
                  "div",
                  {},
                  h("p", { className: "text-xs text-mute" }, email.from),
                  h("p", { className: "text-[0.9375rem] font-medium text-ink" }, email.subject),
                  emailNote &&
                    h("p", { className: "text-xs text-ink", style: { marginTop: "0.375rem" } }, `✓ ${emailNote}`)
                )
              )
            )
          );
        }

        if (visual === "statements") {
          const banks = list(entry, ["banks"]);
          const bankBadge = field(entry, ["bankBadge"], "");
          return h(
            "ul",
            {},
            banks.map((bank, i) =>
              h(
                "li",
                { key: i, style: { ...row, display: "flex", alignItems: "center", gap: "1rem" } },
                h(
                  "span",
                  {
                    "aria-hidden": "true",
                    style: {
                      display: "inline-grid",
                      placeItems: "center",
                      width: "2rem",
                      height: "2rem",
                      borderRadius: "3px",
                      color: "#fff",
                      fontWeight: 700,
                      backgroundColor: bank.color,
                    },
                  },
                  (bank.name || "?")[0]
                ),
                h(
                  "div",
                  {},
                  h("p", { className: "text-[0.9375rem] font-medium text-ink" }, `${bank.name} · ${bank.client}`),
                  h("p", { className: "fig text-xs text-mute" }, `${bank.date} · ${bank.transactions} transactions`)
                ),
                bankBadge &&
                  h("span", { className: "text-xs font-medium text-ink", style: { marginLeft: "auto" } }, `✓ ${bankBadge}`)
              )
            )
          );
        }

        if (visual === "categorise") {
          const transactions = list(entry, ["transactions"]);
          return h(
            "ul",
            {},
            transactions.map((txn, i) =>
              h(
                "li",
                { key: i, style: { ...row, display: "flex", alignItems: "center", justifyContent: "space-between", gap: "1rem" } },
                h("span", { className: "text-[0.9375rem] text-ink" }, txn.name),
                h(
                  "span",
                  { className: "text-xs font-medium text-ink", style: { display: "flex", alignItems: "center", gap: "0.5rem" } },
                  h("span", { "aria-hidden": "true", style: { width: "0.5rem", height: "0.5rem", borderRadius: "1px", backgroundColor: txn.color } }),
                  txn.category
                ),
                h("span", { className: "fig text-sm text-ink" }, txn.amount)
              )
            )
          );
        }

        if (visual === "alerts") {
          const alerts = list(entry, ["alerts"]);
          return h(
            "ul",
            {},
            alerts.map((alert, i) =>
              h(
                "li",
                { key: i, style: { ...row, display: "flex", alignItems: "center", gap: "1rem" } },
                h("span", { "aria-hidden": "true", style: { color: alert.color } }, "●"),
                h(
                  "div",
                  {},
                  h("p", { className: "text-[0.9375rem] font-medium text-ink" }, alert.company),
                  h("p", { className: "text-xs text-mute" }, `${alert.bank} · ${alert.label}`)
                )
              )
            )
          );
        }

        if (visual === "balance") {
          const columns = list(entry, ["ledger", "columns"]);
          const rows = list(entry, ["ledger", "rows"]);
          const footer = field(entry, ["ledger", "footer"], "");
          if (columns.length === 0 && rows.length === 0) return null;
          const grid = `minmax(0,1fr) ${columns.slice(1).map(() => "4.5rem").join(" ")}`;
          return h(
            "div",
            {},
            h(
              "div",
              { style: { display: "grid", gridTemplateColumns: grid, padding: "0.625rem 1.25rem", fontSize: "0.75rem", fontWeight: 500, color: "var(--color-mute)", borderBottom: "1px solid var(--color-ink)" } },
              columns.map((c, i) => h("span", { key: i, style: { textAlign: i === 0 ? "left" : "right" } }, c))
            ),
            rows.map((entryRow, i) =>
              h(
                "div",
                { key: i, style: { ...row, display: "grid", gridTemplateColumns: "minmax(0,1fr) 4.5rem 4.5rem" } },
                h("span", { className: "text-ink" }, entryRow.account),
                h("span", { className: "fig text-sm text-ink", style: { textAlign: "right" } }, entryRow.debit || ""),
                h("span", { className: "fig text-sm text-ink", style: { textAlign: "right" } }, entryRow.credit || "")
              )
            ),
            footer &&
              h(
                "p",
                { className: "text-sm font-medium text-ink", style: { padding: "0.75rem 1.25rem", borderTop: "1px solid var(--color-ink)" } },
                `✓ ${footer}`
              )
          );
        }

        return null;
      }

      function renderFeatureCard(entry) {
        const title = field(entry, ["title"], "");
        const description = field(entry, ["description"], "");
        const visual = field(entry, ["visual"], "");
        return h(
          "article",
          { className: "sheet", style: { maxWidth: "28rem", overflow: "hidden" } },
          h(
            "div",
            { style: { padding: "1.5rem" } },
            h("h3", { className: "h-row text-2xl" }, title),
            description && h("p", { className: "text-mute text-[0.9375rem]", style: { marginTop: "0.625rem" } }, description)
          ),
          h(
            "div",
            { style: { borderTop: "1px solid var(--color-rule)", backgroundColor: "var(--color-paper)" } },
            h("div", { style: { backgroundColor: "#fff" } }, renderFeatureVisual(entry, visual))
          )
        );
      }

      CMS.registerPreviewTemplate("features", ({ entry }) => {
        const title = field(entry, ["title"], null);
        if (title !== null) return renderFeatureCard(entry);
        return h(
          "section",
          { style: { padding: "2.5rem 2rem" } },
          sectionHeader({
            label: field(entry, ["eyebrow"], ""),
            heading: field(entry, ["heading"], ""),
            sub: field(entry, ["subheading"], ""),
          })
        );
      });

      // plans (folder collection): one pricing card, matching the <article>
      // in src/pages/pricing.astro (name/badge, tagline, monthly price, cta,
      // allowances, feature checklist). Yearly price/toggle state and the
      // comparison table are page-level concerns, not fields on a single plan.
      CMS.registerPreviewTemplate("plans", ({ entry }) => {
        const featured = field(entry, ["featured"], false);
        const dark = Boolean(featured);
        const allowances = list(entry, ["allowances"]);
        const features = list(entry, ["features"]);
        const cta = field(entry, ["cta"], null);

        return h(
          "article",
          {
            className: dark ? "on-dark bg-ink text-white" : "bg-white",
            style: { padding: "1.5rem 1.75rem", border: "1px solid var(--color-ink)", borderRadius: "4px", maxWidth: "22rem" },
          },
          h(
            "div",
            { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "1rem" } },
            h("h2", { className: "font-display font-semibold text-2xl", style: dark ? { color: "#fff" } : undefined }, field(entry, ["name"], "")),
            field(entry, ["badge"], "") &&
              h("span", { className: "bg-brand text-ink text-xs font-semibold", style: { padding: "0.25rem 0.5rem", borderRadius: "3px", whiteSpace: "nowrap" } }, field(entry, ["badge"], ""))
          ),
          field(entry, ["tagline"], "") &&
            h("p", { className: dark ? "text-white/70" : "text-mute", style: { marginTop: "0.5rem" } }, field(entry, ["tagline"], "")),
          h(
            "p",
            { style: { marginTop: "1.5rem" } },
            h("span", { className: "font-display font-bold text-5xl tabular-nums" }, `£${field(entry, ["monthlyPrice"], 0)}`),
            h("span", { className: dark ? "text-white/60" : "text-mute", style: { fontSize: "0.875rem", marginLeft: "0.25rem" } }, "/ month")
          ),
          cta &&
            h("a", { href: cta.href, className: dark ? "btn btn-primary" : "btn btn-line", style: { marginTop: "1.5rem", display: "inline-flex" } }, cta.label),
          allowances.length > 0 &&
            h(
              "dl",
              { style: { marginTop: "1.75rem", fontSize: "0.875rem" } },
              allowances.map((item, i) =>
                h(
                  "div",
                  { key: i, style: { display: "flex", justifyContent: "space-between", gap: "1rem", borderTop: dark ? "1px solid rgba(255,255,255,0.15)" : "1px solid var(--color-rule)", padding: "0.6rem 0" } },
                  h("dt", { className: dark ? "text-white/70" : "text-mute" }, item.label),
                  h("dd", { className: "font-medium tabular-nums" }, item.value)
                )
              )
            ),
          features.length > 0 &&
            h(
              "ul",
              { style: { marginTop: "0.5rem", fontSize: "0.875rem" } },
              features.map((f, i) => h("li", { key: i, style: { padding: "0.4rem 0", display: "flex", gap: "0.5rem" } }, "✓ ", f))
            )
        );
      });

      // sections/pricing.md: the header + billing toggle at the top of
      // /pricing (PageHead + the "monthly / yearly" button group). The plan
      // cards and comparison table are driven by the `plans` collection and
      // this file's own `comparison.rows`, not reproduced here — the hint in
      // config.yml already says the comparison rows are edited in Git.
      CMS.registerPreviewTemplate("pricing", ({ entry }) => {
        const before = field(entry, ["headline", "before"], "");
        const accent = field(entry, ["headline", "accent"], "");
        const after = field(entry, ["headline", "after"], "");
        const monthlyLabel = field(entry, ["billing", "monthlyLabel"], "");
        const yearlyLabel = field(entry, ["billing", "yearlyLabel"], "");

        return h(
          "section",
          { className: "bg-paper grid-paper", style: { padding: "2.5rem 2rem" } },
          field(entry, ["badge"], "") && h("p", { className: "label", style: { marginBottom: "1.5rem" } }, field(entry, ["badge"], "")),
          h("h1", { className: "display-sm" }, `${before} `, h("span", { className: "mark" }, accent), ` ${after}`),
          field(entry, ["subheading"], "") &&
            h("p", { className: "lede", style: { marginTop: "1.5rem", maxWidth: "60ch" } }, field(entry, ["subheading"], "")),
          (monthlyLabel || yearlyLabel) &&
            h(
              "div",
              { style: { display: "inline-flex", border: "1px solid var(--color-ink)", borderRadius: "4px", padding: "0.25rem", marginTop: "1.5rem" } },
              monthlyLabel && h("span", { className: "billing-btn", "aria-pressed": "true" }, monthlyLabel),
              yearlyLabel && h("span", { className: "billing-btn" }, yearlyLabel)
            ),
          bulletRow(list(entry, ["trustPoints"]))
        );
      });

      // sections/topbar.md: the ink announcement strip (TopBar.astro).
      CMS.registerPreviewTemplate("topbar", ({ entry }) =>
        h(
          "div",
          { className: "bg-ink text-white", style: { padding: "0.75rem 1.5rem", display: "flex", alignItems: "center", justifyContent: "center", gap: "0.625rem" } },
          h("span", { "aria-hidden": "true", className: "bg-brand", style: { width: "0.5rem", height: "0.5rem", display: "inline-block" } }),
          h(
            "span",
            {},
            `${field(entry, ["announcement", "before"], "")} `,
            h("span", { style: { fontWeight: 600 } }, field(entry, ["announcement", "highlight"], "")),
            ` ${field(entry, ["announcement", "after"], "")}`
          ),
          field(entry, ["announcement", "linkLabel"], "") &&
            h(
              "span",
              { style: { textDecoration: "underline", textDecorationColor: "var(--color-brand)", textDecorationThickness: "2px" } },
              field(entry, ["announcement", "linkLabel"], "")
            )
        )
      );

          "div",
          { className: "bg-paper", style: { padding: "2rem", borderTop: "1px solid var(--color-rule)" } },
          links.length > 0 &&
            h(
              "ul",
              { style: { display: "flex", flexWrap: "wrap", gap: "1.5rem", fontSize: "0.9375rem" } },
              links.map((link, i) => h("li", { key: i }, h("a", { className: "link", href: link.href }, link.label)))
            ),
          h(
            "p",
            { className: "text-mute", style: { marginTop: "1.5rem", paddingTop: "1rem", borderTop: "1px solid var(--color-rule)", fontSize: "0.8125rem" } },
            field(entry, ["copyright"], "")
          )
        );
      });

      // site/navigation.md. Nav.astro's link row, login link and CTA
      // button. The Solutions dropdown's entries come from the `solutions`
      // collection, not this entry, so only `nav.menuLabel` (the dropdown's
      // own label) is shown, without its contents.
      CMS.registerPreviewTemplate("navigation", ({ entry }) => {
        const links = list(entry, ["links"]);
        const login = field(entry, ["login"], null);
        const cta = field(entry, ["cta"], null);
        const menuLabel = field(entry, ["menuLabel"], "");

        return h(
          "nav",
          { className: "bg-white", style: { padding: "1rem 1.5rem", borderBottom: "1px solid var(--color-rule)", display: "flex", alignItems: "center", gap: "1.5rem", flexWrap: "wrap" } },
          menuLabel && h("span", { className: "text-mute text-sm" }, menuLabel, " ▾"),
          links.map((link, i) => h("a", { key: i, className: "text-mute text-sm", href: link.href, style: { textDecoration: "none" } }, link.label)),
          h(
            "span",
            { style: { marginLeft: "auto", display: "flex", alignItems: "center", gap: "1rem" } },
            login && h("a", { href: login.href, className: "text-sm font-medium text-ink" }, login.label),
            cta && h("a", { href: cta.href, className: "btn btn-sm btn-primary" }, cta.label)
          )
        );
      });
    </script>
  </body>
</html>
