          - {label: Heading, name: heading, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
      - label: Features
        name: features
        file: src/content/sections/features.md
        fields:
          - {label: Eyebrow, name: eyebrow, widget: string, required: false}
          - {label: Heading, name: heading, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
      - label: Hero
        name: hero
        file: src/content/sections/hero.md
        fields:
          - {label: Page Title, name: pageTitle, widget: string, required: false}
          - {label: Page Description, name: pageDescription, widget: text, required: false}
          - {label: Badge, name: badge, widget: string, required: false}
          - label: Headline
            name: headline
            widget: object
            required: false
            fields:
              - {label: Before, name: before, widget: string, required: false}
              - {label: Accent, name: accent, widget: string}
              - {label: After, name: after, widget: string, required: false}
          - label: Form
            name: form
            widget: object
            required: false
            fields:
              - {label: Title, name: title, widget: string, required: false}
              - {label: Subtitle, name: subtitle, widget: string, required: false}
              - {label: Placeholder, name: placeholder, widget: string, required: false}
              - {label: Submit Label, name: submitLabel, widget: string}
              - {label: Loading Label, name: loadingLabel, widget: string, required: false}
              - {label: Source, name: source, widget: string, required: false}
              - {label: Note, name: note, widget: text, required: false}
              - {label: Success Title, name: successTitle, widget: string, required: false}
              - {label: Success Message, name: successMessage, widget: text, required: false}
              - {label: Error Message, name: errorMessage, widget: text, required: false}
