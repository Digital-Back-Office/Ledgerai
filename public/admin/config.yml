# Decap CMS configuration. Served at /admin/ (see index.html).
# Generated shape mirrors the zod schemas in src/content.config.ts: every field
# here is a key the schema accepts; keep the two in step.
backend:
  name: github
  repo: Digital-Back-Office/Ledgerai
  branch: main
  auth_endpoint: admin/auth.html
local_backend: true
publish_mode: editorial_workflow
site_url: https://ledgerai.backoffice.digital
display_url: https://ledgerai.backoffice.digital
media_folder: public
public_folder: /
collections:
  - name: sections
    label: Page sections
    files:
      - label: Blog-cta
        name: blog-cta
        file: src/content/sections/blog-cta.md
        fields:
          - {label: Eyebrow, name: eyebrow, widget: string, required: false}
          - {label: Heading, name: heading, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
          - label: Buttons
            name: ctas
            widget: list
            required: false
            fields:
              - {label: Label, name: label, widget: string}
              - {label: Href, name: href, widget: string, required: false}
              - {label: Event, name: event, widget: string, required: false}
              - {label: Style, name: style, widget: select, required: false, options: [primary, secondary, ghost], default: primary}
              - {label: Opens Popup, name: opensPopup, widget: boolean, required: false}
              - {label: External, name: external, widget: boolean, required: false}
      - label: Blog-index
        name: blog-index
        file: src/content/sections/blog-index.md
        fields:
          - {label: Page Title, name: pageTitle, widget: string, required: false}
          - {label: Page Description, name: pageDescription, widget: text, required: false}
          - {label: Badge, name: badge, widget: string, required: false}
          - label: Headline
            name: headline
            widget: object
            required: false
            fields:
              - {label: Before, name: before, widget: string, required: false}
              - {label: Accent, name: accent, widget: string}
              - {label: After, name: after, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
          - {label: Search Placeholder, name: searchPlaceholder, widget: string, required: false}
          - {label: All Categories Label, name: allCategoriesLabel, widget: string, required: false}
          - label: Empty State
            name: emptyState
            widget: object
            required: false
            fields:
              - {label: Message, name: message, widget: string}
              - {label: Action, name: action, widget: string}
      - label: Blog-post-cta
        name: blog-post-cta
        file: src/content/sections/blog-post-cta.md
        fields:
          - {label: Heading, name: heading, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
          - label: Buttons
            name: ctas
            widget: list
            required: false
            fields:
              - {label: Label, name: label, widget: string}
              - {label: Href, name: href, widget: string, required: false}
              - {label: Event, name: event, widget: string, required: false}
              - {label: Style, name: style, widget: select, required: false, options: [primary, secondary, ghost], default: primary}
              - {label: Opens Popup, name: opensPopup, widget: boolean, required: false}
              - {label: External, name: external, widget: boolean, required: false}
      - label: Book-demo
        name: book-demo
        file: src/content/sections/book-demo.md
        fields:
          - {label: Eyebrow, name: eyebrow, widget: string, required: false}
          - {label: Heading, name: heading, widget: string, required: false}
          - {label: Subheading, name: subheading, widget: text, required: false}
          - label: Testimonial
            name: testimonial
            widget: object
            required: false
            fields:
              - {label: Quote, name: quote, widget: text}
              - {label: Stars, name: stars, widget: number, required: false, value_type: int, default: 5}
          - label: Form
            name: form
            widget: object
            required: false
            fields:
              - {label: Title, name: title, widget: string, required: false}
              - {label: Subtitle, name: subtitle, widget: string, required: false}
              - {label: Placeholder, name: placeholder, widget: string, required: false}
              - {label: Submit Label, name: submitLabel, widget: string}
              - {label: Loading Label, name: loadingLabel, widget: string, required: false}
              - {label: Source, name: source, widget: string, required: false}
              - {label: Note, name: note, widget: text, required: false}
              - {label: Success Title, name: successTitle, widget: string, required: false}
              - {label: Success Message, name: successMessage, widget: text, required: false}
              - {label: Error Message, name: errorMessage, widget: text, required: false}
              - {label: Connection Error Message, name: connectionErrorMessage, widget: text, required: false}
              - label: Fields
                name: fields
                widget: list
                required: false
                fields:
                  - {label: Name, name: name, widget: string}
                  - {label: Placeholder, name: placeholder, widget: string}
                  - {label: Type, name: type, widget: select, required: false, options: [text, email, tel], default: text}
